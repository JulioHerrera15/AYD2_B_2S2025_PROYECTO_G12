version: "3.8"

# Uso:
#   docker compose up --build
#   docker compose up -d --build     (en segundo plano)
#   docker compose down              (detener y limpiar)
#
# Mock ERP AS/400 en http://localhost:4000
# Mock POS (32) en http://localhost:4001

services:
  mock-erp:
    build: ./mock-erp
    container_name: sgo-mock-erp
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/"]
      interval: 10s
      timeout: 3s
      retries: 3

  mock-pos:
    build: ./mock-pos
    container_name: sgo-mock-pos
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/"]
      interval: 10s
      timeout: 3s
      retries: 3
