services:
  db-operacional:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_OPERACIONAL_DB}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_OPERACIONAL_MULTIPLE_DATABASES}
    volumes:
      - sgo_db_operacional_data:/var/lib/postgresql/data
      - ./scripts/postgres/crear-bases-adicionales.sh:/docker-entrypoint-initdb.d/crear-bases-adicionales.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_OPERACIONAL_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-finanzas:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_FINANZAS_DB}
    volumes:
      - sgo_db_finanzas_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_FINANZAS_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-auditoria:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_AUDITORIA_DB}
    volumes:
      - sgo_db_auditoria_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_AUDITORIA_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - sgo_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--notify-keyspace-events", "Ex"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  sample-api:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.Sample.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db-operacional;Port=5432;Database=sgo_sample_api;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      Outbox__PollingIntervalMs: ${OUTBOX_POLLING_MS}
      Outbox__MaxReintentos: ${OUTBOX_MAX_REINTENTOS}
      Outbox__BatchSize: ${OUTBOX_BATCH_SIZE}
    ports:
      - "8081:8080"
    depends_on:
      db-operacional:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  sample-worker:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.Sample.Worker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db-operacional;Port=5432;Database=sgo_sample_worker;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      Outbox__PollingIntervalMs: ${OUTBOX_POLLING_MS}
      Outbox__MaxReintentos: ${OUTBOX_MAX_REINTENTOS}
      Outbox__BatchSize: ${OUTBOX_BATCH_SIZE}
    ports:
      - "8082:8080"
    depends_on:
      db-operacional:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ordenes-api:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.Ordenes.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db-operacional;Port=5432;Database=sgo_ordenes;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      Outbox__Source: ordenes
      Outbox__PollingIntervalMs: ${OUTBOX_POLLING_MS}
      Outbox__MaxReintentos: ${OUTBOX_MAX_REINTENTOS}
      Outbox__BatchSize: ${OUTBOX_BATCH_SIZE}
    ports:
      - "8083:8080"
    depends_on:
      db-operacional:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sgo_db_operacional_data:
  sgo_db_finanzas_data:
  sgo_db_auditoria_data:
  sgo_rabbitmq_data:
