services:
  db-operacional:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_OPERACIONAL_DB}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_OPERACIONAL_MULTIPLE_DATABASES}
    volumes:
      - sgo_db_operacional_data:/var/lib/postgresql/data
      - ./scripts/postgres/crear-bases-adicionales.sh:/docker-entrypoint-initdb.d/crear-bases-adicionales.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_OPERACIONAL_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-finanzas:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_FINANZAS_DB}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_FINANZAS_MULTIPLE_DATABASES}
    volumes:
      - sgo_db_finanzas_data:/var/lib/postgresql/data
      - ./scripts/postgres/crear-bases-adicionales.sh:/docker-entrypoint-initdb.d/crear-bases-adicionales.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_FINANZAS_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-auditoria:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_AUDITORIA_DB}
    volumes:
      - sgo_db_auditoria_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_AUDITORIA_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - sgo_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--notify-keyspace-events", "Ex"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  sample-api:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.Sample.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db-operacional;Port=5432;Database=sgo_sample_api;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      Outbox__PollingIntervalMs: ${OUTBOX_POLLING_MS}
      Outbox__MaxReintentos: ${OUTBOX_MAX_REINTENTOS}
      Outbox__BatchSize: ${OUTBOX_BATCH_SIZE}
    ports:
      - "8081:8080"
    depends_on:
      db-operacional:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  sample-worker:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.Sample.Worker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db-operacional;Port=5432;Database=sgo_sample_worker;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      Outbox__PollingIntervalMs: ${OUTBOX_POLLING_MS}
      Outbox__MaxReintentos: ${OUTBOX_MAX_REINTENTOS}
      Outbox__BatchSize: ${OUTBOX_BATCH_SIZE}
    ports:
      - "8082:8080"
    depends_on:
      db-operacional:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-api:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.Auth.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db-operacional;Port=5432;Database=sgo_auth;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      Auth__JwtSecret: ${JWT_SECRET}
      Auth__JwtExpiracionMinutos: ${AUTH_JWT_EXPIRACION_MINUTOS}
      Auth__CarritoTtlSegundos: ${AUTH_CARRITO_TTL_SEGUNDOS}
    ports:
      - "8088:8080"
    depends_on:
      db-operacional:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ordenes-api:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.Ordenes.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db-operacional;Port=5432;Database=sgo_ordenes;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      Outbox__Source: ordenes
      Outbox__PollingIntervalMs: ${OUTBOX_POLLING_MS}
      Outbox__MaxReintentos: ${OUTBOX_MAX_REINTENTOS}
      Outbox__BatchSize: ${OUTBOX_BATCH_SIZE}
    ports:
      - "8083:8080"
    depends_on:
      db-operacional:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  inventario-api:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.Inventario.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db-operacional;Port=5432;Database=sgo_inventario;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      Outbox__Source: inventario
      Outbox__PollingIntervalMs: ${OUTBOX_POLLING_MS}
      Outbox__MaxReintentos: ${OUTBOX_MAX_REINTENTOS}
      Outbox__BatchSize: ${OUTBOX_BATCH_SIZE}
    ports:
      - "8086:8080"
    depends_on:
      db-operacional:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  payklik-mock:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.Mocks.PayKlik/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8084:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  pagos-api:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.Pagos.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db-finanzas;Port=5432;Database=sgo_pagos;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      Outbox__Source: pagos
      Outbox__PollingIntervalMs: ${OUTBOX_POLLING_MS}
      Outbox__MaxReintentos: ${OUTBOX_MAX_REINTENTOS}
      Outbox__BatchSize: ${OUTBOX_BATCH_SIZE}
      PayKlik__BaseUrl: http://payklik-mock:8080
    ports:
      - "8085:8080"
    depends_on:
      db-finanzas:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      payklik-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  sat-mock:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.Mocks.SAT/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8086:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  facturacion-api:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.Facturacion.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db-finanzas;Port=5432;Database=sgo_facturacion;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      Outbox__Source: facturacion
      Outbox__PollingIntervalMs: ${OUTBOX_POLLING_MS}
      Outbox__MaxReintentos: ${OUTBOX_MAX_REINTENTOS}
      Outbox__BatchSize: ${OUTBOX_BATCH_SIZE}
      Sat__BaseUrl: http://sat-mock:8080
      Sat__PollingIntervalMs: "500"
    ports:
      - "8087:8080"
    depends_on:
      db-finanzas:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      sat-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mock-mensajeria:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.MockMensajeria/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      MockMensajeria__ForzarFalla: ${MOCK_MENSAJERIA_FORZAR_FALLA}
    ports:
      - "8089:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  notificaciones-api:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.Notificaciones.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db-operacional;Port=5432;Database=sgo_notificaciones;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      Mensajeria__MockBaseUrl: http://mock-mensajeria:8080
    ports:
      - "8090:8080"
    depends_on:
      db-operacional:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mock-mensajeria:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  consulta-estado-api:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.ConsultaEstado.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db-operacional;Port=5432;Database=sgo_consulta_estado;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    ports:
      - "8091:8080"
    depends_on:
      db-operacional:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.ApiGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
    depends_on:
      auth-api:
        condition: service_healthy
      consulta-estado-api:
        condition: service_healthy
      notificaciones-api:
        condition: service_healthy
      mock-mensajeria:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ApiGateway__BaseUrl: http://api-gateway:8080
    ports:
      - "8092:8080"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  auditoria-worker:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.Auditoria.Worker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db-auditoria;Port=5432;Database=sgo_auditoria;Username=${PG_AUDIT_USER};Password=${PG_AUDIT_PASS}
      ConnectionStrings__PostgresMigracion: Host=db-auditoria;Port=5432;Database=sgo_auditoria;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      Auditoria__AppUsuario: ${PG_AUDIT_USER}
      Auditoria__AppPassword: ${PG_AUDIT_PASS}
    ports:
      - "8093:8080"
    depends_on:
      db-auditoria:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sgo_db_operacional_data:
  sgo_db_finanzas_data:
  sgo_db_auditoria_data:
  sgo_rabbitmq_data:

