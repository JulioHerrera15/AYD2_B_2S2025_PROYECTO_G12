services:
  db-operacional:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_OPERACIONAL_DB}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_OPERACIONAL_MULTIPLE_DATABASES}
    volumes:
      - sgo_db_operacional_data:/var/lib/postgresql/data
      - ./scripts/postgres/crear-bases-adicionales.sh:/docker-entrypoint-initdb.d/crear-bases-adicionales.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_OPERACIONAL_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-finanzas:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_FINANZAS_DB}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_FINANZAS_MULTIPLE_DATABASES}
    volumes:
      - sgo_db_finanzas_data:/var/lib/postgresql/data
      - ./scripts/postgres/crear-bases-adicionales.sh:/docker-entrypoint-initdb.d/crear-bases-adicionales.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_FINANZAS_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-auditoria:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_AUDITORIA_DB}
    volumes:
      - sgo_db_auditoria_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_AUDITORIA_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - sgo_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-pos:
    build:
      context: ../Mocks/mock-pos
    container_name: sgo-mock-pos
    ports:
      - "4001:4001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4001/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mock-erp:
    build:
      context: ../Mocks/mock-erp
    container_name: sgo-mock-erp
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-api:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.Auth.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db-operacional;Port=5432;Database=sgo_auth;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      Auth__JwtSecret: ${JWT_SECRET}
      Auth__JwtExpiracionMinutos: ${AUTH_JWT_EXPIRACION_MINUTOS}
      Auth__CarritoTtlSegundos: ${AUTH_CARRITO_TTL_SEGUNDOS}
      Mensajeria__MockBaseUrl: http://mock-mensajeria:8080
      # Retencion de stock del carrito: Auth llama a Inventario por la red interna.
      Inventario__BaseUrl: http://inventario-api:8080
    ports:
      - "8088:8080"
    depends_on:
      db-operacional:
        condition: service_healthy
      redis:
        condition: service_healthy
      inventario-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ordenes-api:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.Ordenes.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db-operacional;Port=5432;Database=sgo_ordenes;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      Outbox__Source: ordenes
      Outbox__PollingIntervalMs: ${OUTBOX_POLLING_MS}
      Outbox__MaxReintentos: ${OUTBOX_MAX_REINTENTOS}
      Outbox__BatchSize: ${OUTBOX_BATCH_SIZE}
      # Validacion de precios de la orden contra el catalogo de Inventario (red interna).
      Inventario__BaseUrl: http://inventario-api:8080
      # Ordenes a credito: el email del JWT de Auth debe coincidir con el clienteId.
      Auth__JwtSecret: ${JWT_SECRET}
      # Segundos maximos esperando la respuesta de Credito antes de rechazar la orden.
      Credito__TimeoutEvaluacionSegundos: "30"
    ports:
      - "8083:8080"
    depends_on:
      db-operacional:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      inventario-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  inventario-api:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.Inventario.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db-operacional;Port=5432;Database=sgo_inventario;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      Outbox__Source: inventario
      Outbox__PollingIntervalMs: ${OUTBOX_POLLING_MS}
      Outbox__MaxReintentos: ${OUTBOX_MAX_REINTENTOS}
      Outbox__BatchSize: ${OUTBOX_BATCH_SIZE}
      Inventario__CarritoTtlSegundos: ${INVENTARIO_CARRITO_TTL_SEGUNDOS:-900}
    ports:
      - "8094:8080"
    depends_on:
      db-operacional:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  integracion-pos-worker:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.IntegracionPos.Worker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db-operacional;Port=5432;Database=sgo_integracion_pos;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      Pos__BaseUrl: http://mock-pos:4001
      Outbox__Source: integracion-pos
      Outbox__PollingIntervalMs: ${OUTBOX_POLLING_MS}
      Outbox__MaxReintentos: ${OUTBOX_MAX_REINTENTOS}
      Outbox__BatchSize: ${OUTBOX_BATCH_SIZE}
    ports:
      - "8095:8080"
    depends_on:
      db-operacional:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mock-pos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  integracion-erp-worker:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.IntegracionErp.Worker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db-operacional;Port=5432;Database=sgo_integracion_erp;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      Erp__BaseUrl: http://mock-erp:4000
      Erp__Formato: ${ERP_FORMATO:-CSV}
      Erp__TiempoEsperaMs: ${ERP_TIMEOUT_MS:-5000}
      Erp__MaxReintentos: ${ERP_MAX_REINTENTOS:-3}
      Erp__MaxIntentosLote: ${ERP_MAX_INTENTOS_LOTE:-5}
      Erp__IntervaloConsolidacionMinutos: ${ERP_INTERVALO_MINUTOS:-30}
      Erp__IntervaloHistorialMinutos: ${ERP_INTERVALO_HISTORIAL_MINUTOS:-${ERP_INTERVALO_MINUTOS:-30}}
      Erp__IntervaloConciliacionHoras: ${ERP_INTERVALO_CONCILIACION_HORAS:-24}
      Outbox__Source: integracion-erp
      Outbox__PollingIntervalMs: ${OUTBOX_POLLING_MS}
      Outbox__MaxReintentos: ${OUTBOX_MAX_REINTENTOS}
      Outbox__BatchSize: ${OUTBOX_BATCH_SIZE}
    ports:
      - "8096:8080"
    depends_on:
      db-operacional:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mock-erp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  despacho-api:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.Despacho.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db-operacional;Port=5432;Database=sgo_despacho;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      Outbox__Source: despacho
      Outbox__PollingIntervalMs: ${OUTBOX_POLLING_MS}
      Outbox__MaxReintentos: ${OUTBOX_MAX_REINTENTOS}
      Outbox__BatchSize: ${OUTBOX_BATCH_SIZE}
      LogiExpress__BaseUrl: http://logiexpress-mock:8080
      Inventario__BaseUrl: http://inventario-api:8080
    ports:
      - "8097:8080"
    depends_on:
      db-operacional:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      logiexpress-mock:
        condition: service_healthy
      inventario-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  payklik-mock:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.Mocks.PayKlik/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      # Boveda de tarjetas guardadas: sobrevive a reinicios del contenedor. Solo
      # referencia, marca, ultimos cuatro y vencimiento; nunca PAN ni CVV. El puerto
      # 8084 queda publicado solo para el admin del mock (modo, cargos, tarjetas): el
      # navegador ya no tokeniza aqui, lo hace Pagos.
      Boveda__RutaArchivo: /data/boveda-tarjetas.json
    volumes:
      - sgo_payklik_boveda:/data
    ports:
      - "8084:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  pagos-api:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.Pagos.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db-finanzas;Port=5432;Database=sgo_pagos;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      Outbox__Source: pagos
      Outbox__PollingIntervalMs: ${OUTBOX_POLLING_MS}
      Outbox__MaxReintentos: ${OUTBOX_MAX_REINTENTOS}
      Outbox__BatchSize: ${OUTBOX_BATCH_SIZE}
      PayKlik__BaseUrl: http://payklik-mock:8080
      # Tarjetas guardadas y tokenizacion: valida el JWT de Auth para saber quien es el cliente.
      Auth__JwtSecret: ${JWT_SECRET}
      # Boveda transitoria de tokens (token_pago): clave AES-256 en base64 (32 bytes).
      # Sin ella, o invalida, pagos-api no arranca.
      Boveda__ClaveCifrado: ${PAGOS_CLAVE_CIFRADO:?PAGOS_CLAVE_CIFRADO es obligatoria (32 bytes en base64)}
      Boveda__TokenTtlMinutos: ${PAGOS_TOKEN_TTL_MINUTOS:-30}
    ports:
      - "8085:8080"
    depends_on:
      db-finanzas:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      payklik-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  credito-api:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.Credito.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db-finanzas;Port=5432;Database=sgo_credito;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      Outbox__Source: credito
      Outbox__PollingIntervalMs: ${OUTBOX_POLLING_MS}
      Outbox__MaxReintentos: ${OUTBOX_MAX_REINTENTOS}
      Outbox__BatchSize: ${OUTBOX_BATCH_SIZE}
      # El cliente sale del claim email del JWT de Auth, igual que en Pagos.
      Auth__JwtSecret: ${JWT_SECRET}
      # Demo: historiales de cliente1..cliente6 al arrancar con la base vacia, y
      # POST /interno/credito/historiales (no enrutado por el gateway).
      Credito__SembrarDemo: "true"
      Credito__EndpointsInternos: "true"
      # Umbrales bajos del entorno demo; cliente5 puede probar elegibilidad con compras pequenas.
      Credito__Politica__PuntajeMinimo: ${CREDITO_PUNTAJE_MINIMO:-50}
      Credito__Politica__AntiguedadMinimaDias: ${CREDITO_ANTIGUEDAD_MINIMA_DIAS:-0}
    ports:
      - "8099:8080"
    depends_on:
      db-finanzas:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  logiexpress-mock:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.Mocks.LogiExpress/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8098:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  sat-mock:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.Mocks.SAT/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8086:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  facturacion-api:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.Facturacion.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db-finanzas;Port=5432;Database=sgo_facturacion;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      Outbox__Source: facturacion
      Outbox__PollingIntervalMs: ${OUTBOX_POLLING_MS}
      Outbox__MaxReintentos: ${OUTBOX_MAX_REINTENTOS}
      Outbox__BatchSize: ${OUTBOX_BATCH_SIZE}
      Sat__BaseUrl: http://sat-mock:8080
      Sat__PollingIntervalMs: "500"
    ports:
      - "8087:8080"
    depends_on:
      db-finanzas:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      sat-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mock-mensajeria:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.MockMensajeria/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      MockMensajeria__ForzarFalla: ${MOCK_MENSAJERIA_FORZAR_FALLA}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Smtp__From: ${SMTP_FROM:-}
    ports:
      - "8089:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  notificaciones-api:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.Notificaciones.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db-operacional;Port=5432;Database=sgo_notificaciones;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      Mensajeria__MockBaseUrl: http://mock-mensajeria:8080
    ports:
      - "8090:8080"
    depends_on:
      db-operacional:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mock-mensajeria:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  consulta-estado-api:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.ConsultaEstado.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db-operacional;Port=5432;Database=sgo_consulta_estado;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    ports:
      - "8091:8080"
    depends_on:
      db-operacional:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.ApiGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      Gateway__ExigirJwt: ${GATEWAY_EXIGIR_JWT:-false}
      Auth__JwtSecret: ${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      auth-api:
        condition: service_healthy
      consulta-estado-api:
        condition: service_healthy
      notificaciones-api:
        condition: service_healthy
      mock-mensajeria:
        condition: service_healthy
      ordenes-api:
        condition: service_healthy
      pagos-api:
        condition: service_healthy
      credito-api:
        condition: service_healthy
      facturacion-api:
        condition: service_healthy
      inventario-api:
        condition: service_healthy
      despacho-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Siembra los datos de demo (usuario + existencias) en cuanto el gateway esta
  # sano. Es idempotente: el registro repetido responde 409 y las existencias se
  # reescriben con PUT, asi que puede correr en cada 'docker compose up'.
  seed-demo:
    # node:22 es la unica imagen ya presente en el entorno que trae bash y curl,
    # que es lo que pide el script. Pesa de mas para lo que hace: si algun dia hay
    # salida a Docker Hub, curlimages/curl + un script POSIX es el reemplazo.
    image: node:22
    environment:
      BASE_URL: http://api-gateway:8080
      MENSAJERIA_URL: http://mock-mensajeria:8080
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@sgo.local}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo1234!}
      DEMO_NOMBRE: ${DEMO_NOMBRE:-Usuario Demo}
    volumes:
      - ./scripts/demo/sembrar-demo.sh:/seed/sembrar-demo.sh:ro
    command: bash /seed/sembrar-demo.sh
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ApiGateway__BaseUrl: http://api-gateway:8080
      MockErp__BaseUrl: http://mock-erp:4000
    ports:
      - "8092:8080"
    depends_on:
      api-gateway:
        condition: service_healthy
      mock-erp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  auditoria-worker:
    build:
      context: .
      dockerfile: src/Services/SgoLogic.Auditoria.Worker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db-auditoria;Port=5432;Database=sgo_auditoria;Username=${PG_AUDIT_USER};Password=${PG_AUDIT_PASS}
      ConnectionStrings__PostgresMigracion: Host=db-auditoria;Port=5432;Database=sgo_auditoria;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      Auditoria__AppUsuario: ${PG_AUDIT_USER}
      Auditoria__AppPassword: ${PG_AUDIT_PASS}
    ports:
      - "8093:8080"
    depends_on:
      db-auditoria:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Siembra datos de demo (usuarios con contrasena 1234, inventario, ordenes,
  # envios, pagos, facturas e incidencias) una vez que los servicios migraron
  # sus bases. Corre una vez y termina; solo toca bases vacias (ver
  # scripts/seed/sembrar.sh). SEED_HABILITADO=false en .env lo desactiva.
  seed-datos:
    image: postgres:16-alpine
    restart: "no"
    entrypoint: ["sh", "/seed/sembrar.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_OPERACIONAL_DB: ${POSTGRES_OPERACIONAL_DB}
      SEED_HABILITADO: ${SEED_HABILITADO:-true}
    volumes:
      - ./scripts/seed:/seed:ro
    depends_on:
      auth-api:
        condition: service_healthy
      inventario-api:
        condition: service_healthy
      ordenes-api:
        condition: service_healthy
      despacho-api:
        condition: service_healthy
      consulta-estado-api:
        condition: service_healthy
      pagos-api:
        condition: service_healthy
      facturacion-api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observabilidad/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - sgo_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observabilidad/grafana/provisioning:/etc/grafana/provisioning:ro
      - sgo_grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sgo_payklik_boveda:
  sgo_db_operacional_data:
  sgo_db_finanzas_data:
  sgo_db_auditoria_data:
  sgo_rabbitmq_data:
  sgo_prometheus_data:
  sgo_grafana_data:

