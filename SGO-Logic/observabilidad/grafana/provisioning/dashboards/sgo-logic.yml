# Proveedor de tableros aprovisionados por archivo: Grafana carga los .json de
# observabilidad/grafana/dashboards/ al arrancar, sin importarlos a mano por la UI.
apiVersion: 1

providers:
  - name: sgo-logic
    orgId: 1
    folder: SGO-Logic
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false