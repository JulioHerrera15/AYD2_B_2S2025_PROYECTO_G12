# Override de produccion (EC2). Se usa junto al compose base:
#   docker compose --env-file .env --env-file .env.deploy \
#     -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
#
# Las imagenes de los servicios las construye y publica el pipeline (cd.yml) en
# GHCR; aqui solo se indica de donde bajarlas. IMAGE_PREFIX e IMAGE_TAG vienen de
# .env.deploy, que escribe el pipeline en cada despliegue.
# Los puertos de infraestructura (RabbitMQ, Redis, Prometheus, mocks) siguen
# publicados por el compose base: en la EC2 los cierra el Security Group.

services:
  auth-api:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX requerido}/sgo-auth-api:${IMAGE_TAG:-latest}
    restart: unless-stopped

  ordenes-api:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX requerido}/sgo-ordenes-api:${IMAGE_TAG:-latest}
    restart: unless-stopped

